[basic]
	#Enable or disable autofishing.
	enabled = true
	#Cycle to another fishing rod when the current one is no longer usable.
	multiRod = false
	#Warn when treasure loot conditions for open water are not met.
	openWaterDetection = true
	#Stop using rods before they break.
	breakProtection = false
	#Keep the rod cast by periodically retrying when needed.
	persistentMode = false
	#Pause autofishing while container screens are open.
	disableInGui = false
	#Turn the camera automatically after catching a fish.
	autoTurnView = false
	#Play the arm swing animation when the rod is used.
	enableArmSwing = true
	#Camera turn angle in degrees.
	# Default: 30.0
	# Range: 0.0 ~ 180.0
	turnAngle = 30.0
	#How long to keep the turned view before restoring it.
	# Default: 500
	# Range: 100 ~ 5000
	turnDuration = 500

[advanced]
	#Detect bites from bobber sounds instead of bobber motion.
	useSoundDetection = false
	#Force multiplayer-style detection even in local worlds.
	forceMultiplayerDetection = false
	#Delay before recasting after a catch, in milliseconds.
	# Default: 1500
	# Range: 500 ~ 5000
	recastDelay = 1500
	#Randomize recast delay by up to this percentage.
	# Default: 50
	# Range: 0 ~ 75
	randomDelayPercent = 50
	#Delay before reeling in after a bite, in milliseconds.
	# Default: 1
	# Range: 1 ~ 2000
	reelInDelay = 1
	#Regular expression used to trigger a recast from chat messages.
	clearLagRegex = "\\[ClearLag\\] Removed [0-9]+ Entities!"
